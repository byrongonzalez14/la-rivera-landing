<header class="site-header" [class.is-solid]="solid" [class.is-open]="menuOpen()">
  <a class="brand" routerLink="/" fragment="inicio" (click)="closeMenu()" aria-label="La Rivera, inicio">
    <span class="brand-mark">
      <img src="images/icons/la-rivera-mark-light.svg" alt="" class="mark mark--light" aria-hidden="true">
      <img src="images/icons/la-rivera-mark.svg" alt="" class="mark mark--dark" aria-hidden="true">
    </span>
    <span class="brand-word">La Rivera</span>
  </a>

  <nav class="nav-desktop" aria-label="Principal">
    <a routerLink="/" fragment="casa">La casa</a>
    <a routerLink="/espacios" routerLinkActive="is-active">Espacios</a>
    <a routerLink="/" fragment="experiencias">Experiencias</a>
    <a routerLink="/" fragment="ubicacion">Ubicación</a>
    <a class="nav-cta" routerLink="/reservar" routerLinkActive="is-active">Reservar</a>
  </nav>

  <button
    type="button"
    class="burger"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="menu-movil"
    [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
    (click)="toggleMenu()">
    <span></span>
    <span></span>
  </button>
</header>

<div id="menu-movil" class="drawer" [class.is-open]="menuOpen()" [attr.inert]="menuOpen() ? null : ''">
  <nav aria-label="Menú móvil">
    <a routerLink="/" fragment="casa" (click)="closeMenu()">La casa</a>
    <a routerLink="/espacios" (click)="closeMenu()">Espacios</a>
    <a routerLink="/" fragment="experiencias" (click)="closeMenu()">Experiencias</a>
    <a routerLink="/" fragment="galeria" (click)="closeMenu()">Galería</a>
    <a routerLink="/" fragment="ubicacion" (click)="closeMenu()">Ubicación</a>
    <a routerLink="/contacto" (click)="closeMenu()">Contacto</a>
  </nav>
  <a class="pill pill--solid drawer-cta" routerLink="/reservar" (click)="closeMenu()">Reservar</a>
</div>
